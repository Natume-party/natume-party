<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核算中心 · 登录</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf2ef;font:16px system-ui;color:#163c30}form{width:min(360px,92vw);padding:32px;background:white;border:1px solid #c2d1c7;border-radius:9px}small{letter-spacing:.12em}input,button{width:100%;padding:11px;font:inherit;margin:8px 0;border:1px solid #a6bbad;border-radius:4px}button{background:#195b41;color:white;cursor:pointer}p{color:#924522}</style><form><small>LUTON</small><h1>A3 核算中心</h1><label>中心密码<input type="password" autocomplete="current-password" required autofocus></label><button>进入中心</button><p role="status"></p></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('[role=status]');try{const r=await fetch('/a3/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});if(r.ok){location.replace('/a3/');return}msg.textContent=r.status===429?'尝试次数过多，请约 '+Math.max(1,Math.ceil(Number(r.headers.get('Retry-After')||60)/60))+' 分钟后重试':'密码不正确，请重新输入';document.querySelector('input').select()}catch{msg.textContent='主机连接失败，请重试'}};</script></html>
