<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Natume · 我的河边小世界</title>
  <meta name="description" content="你好，我是 Natume。喜欢游戏、动画与有趣的技术。欢迎来我的河边小屋坐坐，看看作品和日记。">
  <meta name="theme-color" content="#4f9be0">
  <link rel="canonical" href="https://natume.party/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="natume.party">
  <meta property="og:url" content="https://natume.party/">
  <meta property="og:title" content="Natume · 我的河边小世界">
  <meta property="og:description" content="你好，我是 Natume。游戏、动画、技术，还有河边小屋里的一点日常。">
  <meta property="og:image" content="https://natume.party/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="方块风格的小河、茅草屋和枣树，秋天的傍晚">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Natume · 我的河边小世界">
  <meta name="twitter:image" content="https://natume.party/og.jpg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <div id="loading">正在搭建小世界…</div>

  <header class="hud hud-tl">
    <h1>Natume<span class="brand-dot">.</span></h1>
    <p>我的河边小世界</p>
  </header>

  <section id="identity" class="hud identity-card" aria-label="Natume 的个人名片">
    <p class="identity-eyebrow"><span class="identity-spark" aria-hidden="true"></span> WELCOME TO MY LITTLE WORLD</p>
    <h2 class="identity-title">你好，我是 <span>Natume.</span></h2>
    <p class="identity-description">喜欢游戏、动画，还有那些值得慢慢折腾的有趣技术。</p>
    <nav class="identity-links" aria-label="个人名片快速入口">
      <a class="identity-link identity-link-primary" href="#/about">认识我 <span aria-hidden="true">↗</span></a>
      <a class="identity-link" href="#/works">我的作品 <span aria-hidden="true">↗</span></a>
      <a class="identity-link" href="#/diary">日记 <span aria-hidden="true">↗</span></a>
    </nav>
    <p class="identity-tip">✦ 也可以拖动场景，去河边随意转转。</p>
  </section>

  <div class="hud hud-tr">
    <div id="counter" class="pill" title="捡到的枣子">
      <i class="jujube" aria-hidden="true"></i><span class="sr">枣子</span><span id="count">0</span>
    </div>
    <button id="sound" class="pill icon" aria-pressed="false" aria-label="环境声音">
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="hint"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <button id="panel-toggle" class="pill hud" aria-expanded="false" aria-controls="panel">
    <span id="panel-summary">秋 · 晴 · 12:00</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <nav id="panel" class="hud" aria-label="场景设置">
    <div class="group" role="group" aria-label="季节">
      <span class="label">季节</span>
      <button data-season="spring">春</button>
      <button data-season="summer">夏</button>
      <button data-season="autumn">秋</button>
      <button data-season="winter">冬</button>
    </div>
    <div class="group" role="group" aria-label="天气">
      <span class="label">天气</span>
      <button data-weather="sunny">晴</button>
      <button data-weather="rain" id="rain-btn">雨</button>
    </div>
    <div class="group time" role="group" aria-label="时间">
      <span class="label">时间</span>
      <input id="time" type="range" min="0" max="23.99" step="0.05" aria-label="一天中的时间">
      <output id="clock">12:00</output>
      <button id="realtime" aria-pressed="true" title="跟随现实时间">实时</button>
    </div>
  </nav>

  <dialog id="card" aria-label="小屋">
    <div class="card-body">
      <nav class="tabs" role="tablist" aria-label="小屋里的内容">
        <button role="tab" data-tab="about" aria-selected="true">关于我</button>
        <button role="tab" data-tab="works" aria-selected="false">作品</button>
        <button role="tab" data-tab="diary" aria-selected="false">日记</button>
      </nav>
      <article id="card-content" class="md" role="tabpanel" tabindex="0"></article>
      <button id="card-close" class="primary" autofocus>回到河边</button>
    </div>
  </dialog>

  <noscript><p class="noscript">这个小世界需要打开 JavaScript 才能看到。</p></noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
